<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenFlix (Direct Stream)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <style>
    :root {
      --bg: #141414; --card-bg: #181818; --card-hover: #232323; --red: #E50914; --red-hover: #f40612;
      --text: #ffffff; --text-muted: #aaaaaa; --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; background: #141414; border-bottom: 1px solid var(--border); }
    .logo { color: var(--red); font-size: 24px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; background: none; border: 0; cursor: pointer; }
    .btn { padding: 8px 16px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: none; text-decoration: none; }
    .btn-red { background: var(--red); color: #fff; } .btn-gray { background: #333; color: #fff; }
    #player-section { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.96); padding: 24px 40px; overflow-y: auto; }
    .player-container { max-width: 1200px; margin: 0 auto; position: relative; }
    #main-video { width: 100%; max-height: 78vh; background: #000; border-radius: 6px; display: block; }
    .catalog { padding: 40px; display: flex; flex-direction: column; gap: 20px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .movie-card { background: var(--card-bg); border-radius: 6px; overflow: hidden; cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); color: #fff; text-align: left; }
    .movie-card:hover { background: var(--card-hover); }
    .card-title { font-size: 15px; font-weight: 700; word-break: break-word; }
    .card-url { font-size: 11px; color: var(--text-muted); word-break: break-all; }
    .state { text-align: center; padding: 60px; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <button class="logo" onclick="location.reload()">OPENFLIX</button>
    <button class="btn btn-red" id="btn-settings"><i class="fa-solid fa-plus"></i> Add Video Link</button>
  </header>

  <div id="player-section">
    <div class="player-container">
      <video id="main-video" controls playsinline></video>
      <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div id="player-movie-title" style="font-weight: 700; font-size: 18px;"></div>
        <button class="btn btn-gray" id="btn-close-player"><i class="fa-solid fa-xmark"></i> Close Player</button>
      </div>
    </div>
  </div>

  <div class="catalog">
    <h2>My Video Library</h2>
    <div class="card-grid" id="video-grid">
      <div class="state">No videos added yet. Click "Add Video Link" above.</div>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:200;">
    <div style="background:#181818; padding:28px; border-radius:8px; width:440px; display:flex; flex-direction:column; gap:14px;">
      <h3>Add Direct Video Link</h3>
      <label style="font-size:12px; color:#aaa;">Movie or Video Title</label>
      <input type="text" id="vid-name" placeholder="e.g. Afro Samurai" style="padding:10px; background:#000; border:1px solid #444; color:#fff; border-radius:4px; outline:none;">
      <label style="font-size:12px; color:#aaa;">Direct File URL</label>
      <input type="url" id="vid-url" placeholder="http://23.147.64.113/.../movie.mp4" style="padding:10px; background:#000; border:1px solid #444; color:#fff; border-radius:4px; outline:none;">
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
        <button class="btn btn-gray" onclick="$('settings-modal').style.display='none'">Cancel</button>
        <button class="btn btn-red" id="btn-save-vid">Save Video</button>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let videos = JSON.parse(localStorage.getItem('OPENFLIX_DIRECT_VIDEOS') || '[]');

    function render() {
      const grid = $('video-grid');
      if (!videos.length) {
        grid.innerHTML = '<div class="state" style="grid-column: 1/-1;">No videos added yet. Click "Add Video Link" above.</div>';
        return;
      }
      grid.innerHTML = videos.map((v, i) => `
        <button class="movie-card" onclick="playVideo(${i})">
          <div class="card-title"><i class="fa-solid fa-circle-play" style="color:var(--red);"></i> ${escapeHtml(v.name)}</div>
          <div class="card-url">${escapeHtml(v.url)}</div>
        </button>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    const video = $('main-video');
    function playVideo(index) {
      const v = videos[index];
      $('player-movie-title').textContent = v.name;
      video.src = v.url;
      $('player-section').style.display = 'block';
      video.play().catch(err => alert("Playback error: " + err.message + "\n\nNote: Browsers block HTTP video inside HTTPS pages. Use a browser extension that allows insecure content or host this page over HTTP."));
    }

    $('btn-close-player').addEventListener('click', () => {
      video.pause(); video.src = '';
      $('player-section').style.display = 'none';
    });

    $('btn-settings').addEventListener('click', () => $('settings-modal').style.display = 'flex');
    $('btn-save-vid').addEventListener('click', () => {
      const name = $('vid-name'].value.trim();
      const url = $('vid-url').value.trim();
      if (!name || !url) return alert('Please fill in both fields.');
      videos.push({ name, url });
      localStorage.setItem('OPENFLIX_DIRECT_VIDEOS', JSON.stringify(videos));
      $('vid-name').value = ''; $('vid-url').value = '';
      $('settings-modal').style.display = 'none';
      render();
    });

    render();
  </script>
</body>
</html>
